# Render Blueprint: one free web service that serves the API (/api),
# the Swagger test page (/api/docs) and the built React app (/).
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: agriconnect
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # auto = Claude AI reads messages, falling back to the offline rule-based
      # parser when ANTHROPIC_API_KEY is missing or the API is unavailable.
      - key: NLP_MODE
        value: auto
      # Secrets: set these in the Render dashboard (Environment tab), never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MESSENGER_PAGE_TOKEN
        sync: false
      - key: MESSENGER_VERIFY_TOKEN
        sync: false
      - key: MESSENGER_APP_SECRET
        sync: false
      # Texts are logged (GET /api/sms/log) instead of really sent.
      - key: SMS_PROVIDER
        value: console
      - key: FARMER_VERIFICATION
        value: auto
      - key: SEED_DEMO
        value: "true"
      # The free plan has no persistent disk: data resets on every restart/redeploy.
      - key: DB_PATH
        value: /tmp/agriconnect.db
