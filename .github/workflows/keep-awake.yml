# Render's free plan sleeps after 15 minutes idle, and waking takes ~30-60 s —
# long enough for Messenger replies to arrive late. Ping the health check every
# 10 minutes so the server stays awake (750 free hours/month covers 24/7).
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://agriconnect-61co.onrender.com/api/health
